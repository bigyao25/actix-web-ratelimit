[package]
name = "actix-web-ratelimit"
version = "0.2.0"
edition = "2024"
authors = ["bigyao25 <rungroo@gmail.com>"]
description = "A simple and highly customizable rate limiter for actix-web 4"
license = "MIT"
repository = "https://github.com/bigyao25/actix-web-ratelimit"
readme = "README.md"
keywords = ["ratelimit", "rate", "limit", "actix", "actix-web"]
categories = ["security", "web-programming"]

[dependencies]
actix-web = { version = "4", default-features = false, features = ["macros"] }
actix-service = "2"
log = "0.4"
futures-util = "0.3"
dashmap = "6"
redis = { version = "1.8", optional = true, default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
tokio = { version = "1", optional = true, features = ["time"] }

[features]
default = ["redis"]
redis = ["dep:redis", "dep:tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "macros", "time"] }

[[bench]]
name = "memory"
harness = false
