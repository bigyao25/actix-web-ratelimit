name: Benchmark smoke
on:
  pull_request:
    paths: ['benchmarks/**', 'src/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test benchmark tooling
        run: python3 -m unittest discover -s benchmarks/tests -v
      - name: Build and run bounded CI smoke
        id: benchmark
        run: |
          mkdir -p benchmarks/results/ci
          set -o pipefail
          python3 benchmarks/bench.py smoke --resources ci --variants baseline head v0.1.2 v0.2.1 governor --backends memory redis --output benchmarks/results/ci 2>&1 | tee benchmarks/results/ci/run.log
      - name: Generate assessment even on failure
        if: always()
        env:
          BENCHMARK_STATUS: ${{ steps.benchmark.outcome }}
        run: python3 benchmarks/summary.py benchmarks/results/ci --status "$BENCHMARK_STATUS" --output benchmarks/results/ci/assessment.md
      - name: Upload reports and raw diagnostics
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-diagnostics
          path: benchmarks/results/ci/
          retention-days: 14
          if-no-files-found: warn
      - name: Publish workflow assessment
        if: always()
        env:
          BENCHMARK_STATUS: ${{ steps.benchmark.outcome }}
          BENCHMARK_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: python3 benchmarks/summary.py benchmarks/results/ci --status "$BENCHMARK_STATUS" --output benchmarks/results/ci/assessment.md --github-summary
