name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected Cargo.toml version (for example, 0.1.2)"
        required: true
        type: string

permissions: {}

concurrency:
  group: crates-io-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Verify repository administrator
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check branch and administrator permissions
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const repository = await github.rest.repos.get({ owner, repo });
            if (context.ref !== `refs/heads/${repository.data.default_branch}`) {
              throw new Error('Releases must run from the default branch.');
            }
            // Check both the original actor and the actor requesting a rerun.
            const actors = new Set([context.actor, process.env.GITHUB_TRIGGERING_ACTOR]);
            for (const username of actors) {
              if (!username) throw new Error('Unable to identify the triggering actor.');
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username,
              });
              if (data.permission !== 'admin') {
                throw new Error(`Only repository administrators may publish: ${username}`);
              }
            }

  validate:
    name: Run release validation matrix
    needs: authorize
    uses: ./.github/workflows/CI.yml
    permissions:
      contents: read

  publish:
    name: Test and publish
    needs: [authorize, validate]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['package']['version']
          expected = os.environ['EXPECTED_VERSION']
          if version != expected:
              raise SystemExit(f'Version mismatch: Cargo.toml={version}, requested={expected}')
          PY
      - name: Test all features
        run: cargo test --locked --all-features
      - name: Test without default features
        run: cargo test --locked --no-default-features
      - name: Verify package
        run: cargo publish --locked --dry-run
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  tag:
    name: Tag and create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create version tag
        uses: actions/github-script@v9
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = `tags/v${process.env.RELEASE_VERSION}`;
            // Allow this job to be rerun without moving an existing tag.
            try {
              const { data } = await github.rest.git.getRef({ owner, repo, ref: tag });
              if (data.object.sha !== context.sha) {
                throw new Error(`${tag} already exists and points to a different commit.`);
              }
              core.info(`${tag} already points to ${context.sha}.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner, repo, ref: `refs/${tag}`, sha: context.sha,
              });
            }
      - name: Create GitHub Release
        uses: actions/github-script@v9
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const version = process.env.RELEASE_VERSION;
            const tag = `v${version}`;
            let existing;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner, repo, tag,
              });
              existing = data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing) {
              if (existing.draft) {
                throw new Error(`A draft release already exists for ${tag}; publish or remove it before retrying.`);
              }
              core.info(`Release already exists: ${existing.html_url}`);
            } else {
              const { data } = await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                name: tag,
                target_commitish: context.sha,
                body: `Published to crates.io: https://crates.io/crates/actix-web-ratelimit/${version}`,
                generate_release_notes: true,
                draft: false,
                prerelease: version.includes('-'),
              });
              core.info(`Created release: ${data.html_url}`);
            }
