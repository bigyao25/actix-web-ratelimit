[package]
name = "bench-server"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
actix-web = { version = "=4.18.1", default-features = false, features = ["macros"] }
actix-extensible-rate-limit = { version = "=0.4.0", features = ["redis"] }
redis = { version = "=0.26.1", default-features = false, features = ["tokio-comp", "connection-manager"] }
